apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-infra-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloud-infra-app

  template:
    metadata:
      labels:
        app: cloud-infra-app

    spec:
      containers:
        - name: cloud-infra-app
          image: nourcloudregistry.azurecr.io/cloud-infra-app:latest

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
